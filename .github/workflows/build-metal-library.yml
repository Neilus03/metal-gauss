name: build Metal library

on:
  workflow_dispatch:

jobs:
  metal:
    name: Metal kernels (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench,train,test]" \
            lpips scikit-image imageio tqdm torchvision

      - name: Verify Apple Silicon and MPS
        run: |
          test "$(uname -m)" = "arm64"
          python - <<'PY'
          import platform
          import torch

          print(f"machine={platform.machine()}")
          print(f"torch={torch.__version__}")
          print(f"mps_built={torch.backends.mps.is_built()}")
          print(f"mps_available={torch.backends.mps.is_available()}")
          if not torch.backends.mps.is_available():
              raise SystemExit("PyTorch cannot access the hosted Apple GPU")
          PY

      - name: Probe a plain PyTorch MPS allocation
        run: |
          python - <<'PY'
          import torch

          x = torch.zeros((1,), device="mps")
          torch.mps.synchronize()
          print(f"plain_mps_allocation={x.item():.1f}")
          PY

      - name: Run one Metal-Gauss test (diagnostic)
        continue-on-error: true
        run: python -m pytest -q tests/test_absgrad.py::test_absgrad_dominates_the_signed_norm

      - name: Run the complete test suite
        run: python -m pytest -q
