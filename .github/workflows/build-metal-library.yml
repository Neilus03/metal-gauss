name: build Metal library

on:
  workflow_dispatch:
  push:
    paths:
      - "metal_gauss/csrc/*.metal"
      - "scripts/build_metallib.py"
      - ".github/workflows/build-metal-library.yml"

jobs:
  build:
    # This job only builds the portable Metal IR library. It is not a timing
    # job, and it does not replace the CPU checks or claim to validate kernels.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Metal IR library
        run: python3 scripts/build_metallib.py

      - name: Check generated source digest
        run: |
          test -s metal_gauss/csrc/metal_gauss.metallib
          test -s metal_gauss/csrc/metal_gauss.metallib.sha256

      - name: Upload generated library
        uses: actions/upload-artifact@v4
        with:
          name: metal-gauss-metallib
          path: |
            metal_gauss/csrc/metal_gauss.metallib
            metal_gauss/csrc/metal_gauss.metallib.sha256
