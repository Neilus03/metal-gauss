[project]
name = "metal-gauss"
version = "0.1.0"
description = "Differentiable 3D Gaussian Splatting rasterizer, Metal-native. No CUDA anywhere."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
keywords = ["gaussian-splatting", "3dgs", "metal", "apple-silicon", "mps", "radiance-fields"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["torch>=2.5", "numpy>=1.26", "plyfile>=1.0", "ninja>=1.11"]

[project.urls]
Homepage = "https://github.com/nandometzger/metal-gauss"
Source = "https://github.com/nandometzger/metal-gauss"
"Measured rejections" = "https://github.com/nandometzger/metal-gauss/blob/main/bench/results/NEGATIVE_RESULTS.md"

[project.scripts]
metal-gauss-train = "metal_gauss.train:main"
metal-gauss-render = "metal_gauss.render_path:main"

[project.optional-dependencies]
bench = ["pycolmap>=3.10"]
train = ["pycolmap>=3.10", "pillow>=10.0", "scipy>=1.11"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metal_gauss"]
